<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Help Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }

    /* Chatbot window */
    #chatbot {
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }

    #chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a4f8a;
      color: #fff;
      padding: 10px 14px;
    }
    #chat-header span { font-weight: bold; }

    #close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
    }
    #close-btn:hover { background: rgba(255, 255, 255, 0.2); }

    #chat-box {
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      white-space: pre-wrap;
    }
    .user { color: #1a4f8a; font-weight: bold; margin: 8px 0; }
    .bot { color: #222; margin: 8px 0; }
    .error { color: #b00020; margin: 8px 0; }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ccc;
    }
    #user-input { flex: 1; padding: 10px; font-size: 16px; }
    #send-btn { padding: 10px 18px; font-size: 16px; cursor: pointer; }

    /* Button that reopens the chatbot after it is closed */
    #open-btn {
      display: none;
      padding: 12px 20px;
      font-size: 16px;
      background: #1a4f8a;
      color: #fff;
      border: none;
      border-radius: 24px;
      cursor: pointer;
    }
    #open-btn:hover { background: #163f70; }
  </style>
</head>
<body>
  <h1>College Help Chatbot</h1>
  <p>Ask a general question about college life or admissions (Powered by Gemini AI).</p>

  <div id="chatbot">
    <div id="chat-header">
      <span>College Help Chatbot</span>
      <button id="close-btn" title="Close chat" aria-label="Close chat">&times;</button>
    </div>

    <div id="chat-box"></div>

    <div id="input-row">
      <input id="user-input" type="text" placeholder="Type your question..." autofocus />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <button id="open-btn">Open Chat</button>

  <script>
    const chatbot = document.getElementById("chatbot");
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const closeBtn = document.getElementById("close-btn");
    const openBtn = document.getElementById("open-btn");

    function addMessage(text, className) {
      const div = document.createElement("div");
      div.className = className;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage("You: " + message, "user");
      input.value = "";
      sendBtn.disabled = true;
      const loading = addMessage("Thinking...", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        loading.remove();

        if (res.ok) {
          addMessage("Chatbot: " + data.reply, "bot");
        } else {
          addMessage(data.error || "Something went wrong.", "error");
        }
      } catch (err) {
        loading.remove();
        addMessage("Could not reach the server.", "error");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function closeChat() {
      chatbot.style.display = "none";
      openBtn.style.display = "inline-block";
    }

    function openChat() {
      chatbot.style.display = "block";
      openBtn.style.display = "none";
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    closeBtn.addEventListener("click", closeChat);
    openBtn.addEventListener("click", openChat);
  </script>
</body>
</html>
